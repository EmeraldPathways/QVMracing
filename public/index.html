<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Paper-only horse-racing research and decision-quality workbench." />
  <title>QVM Racing Workbench</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b1118'/%3E%3Cpath d='M13 39c7-18 17-24 32-22l-9 9 15 2-13 7-7 14H19l5-12-11 2Z' fill='%23f2b35d'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">Q</span><span>QVM <strong>Racing</strong></span></div>
      <div class="paper-badge"><span></span> PAPER ONLY</div>
      <nav aria-label="Primary navigation">
        <button class="nav-item active" data-view="dashboard">Dashboard</button>
        <button class="nav-item" data-view="races">Race Finder</button>
        <button class="nav-item" data-view="positions">Paper Positions</button>
        <button class="nav-item" data-view="performance">Performance</button>
        <button class="nav-item" data-view="research">Research</button>
        <button class="nav-item" data-view="agents">Agents</button>
        <button class="nav-item" data-view="settings">Settings</button>
      </nav>
      <div class="sidebar-foot"><span class="health-dot"></span><span>Demo provider healthy</span></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><p class="eyebrow">Decision-quality control room</p><h1>QVM Racing Workbench</h1></div>
        <div class="top-actions"><span class="utc">UTC <strong id="clock">--:--:--</strong></span><button class="refresh" id="refreshBtn">Refresh demo data</button></div>
      </header>
      <div id="app" class="content"></div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
